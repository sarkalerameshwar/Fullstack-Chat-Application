services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sarkalerameshwar}/chat-app-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod_chat_backend
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DB_URL=${DB_URL:-${MONGODB_URI}}
      - MONGODB_URI=${MONGODB_URI:-${DB_URL}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-${JWT_SECRET}}
      - CLIENT_URL=${CLIENT_URL:-https://chattx.app,https://www.chattx.app}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    networks:
      - prod_chat_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sarkalerameshwar}/chat-app-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prod_chat_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-backend:5001}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prod_chat_network

networks:
  prod_chat_network:
    driver: bridge
