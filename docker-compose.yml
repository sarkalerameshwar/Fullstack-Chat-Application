services:
  mongodb:
    image: mongo:latest
    container_name: chat_app_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat_network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_app_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/chat_db}
      - DB_URL=${DB_URL:-mongodb://mongodb:27017/chat_db}
      - JWT_SECRET=${JWT_SECRET:-devsecretkey12345}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173,http://localhost:8080}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      - mongodb
    networks:
      - chat_network

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    environment:
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_REALM=${TURN_REALM:-chattx.app}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ${TURN_CERTS_DIR:-./certs}:/etc/coturn/certs:ro
    read_only: true
    tmpfs:
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - chat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat_app_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - chat_network

volumes:
  mongodb_data:

networks:
  chat_network:
    driver: bridge
