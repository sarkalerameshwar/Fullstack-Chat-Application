listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=${TURN_SHARED_SECRET}
realm=${TURN_REALM}
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-multicast-peers
no-loopback-peers
no-cli
stale-nonce=600
min-port=49160
max-port=49200
log-file=stdout
simple-log
